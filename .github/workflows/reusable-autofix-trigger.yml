name: Reusable pre-commit.ci autofix trigger

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number
        required: false
        type: number
      repo_owner:
        description: Repository owner (defaults to caller owner)
        required: false
        type: string
      repo_name:
        description: Repository name (defaults to caller repo)
        required: false
        type: string
      checkout_ref:
        description: Ref of shaypal5/pre-commit-ci-autofix-trigger to check out internally
        required: false
        default: v1
        type: string
      head_sha:
        description: Commit SHA to inspect (defaults to current PR head)
        required: false
        type: string
      bot_logins:
        description: Comma-separated allowlist of bot logins
        required: false
        default: copilot-swe-agent,github-copilot[bot],copilot,claude[bot],claude,chatgpt,openai
        type: string
      label:
        description: Label to apply when autofix should be triggered
        required: false
        default: pre-commit.ci autofix
        type: string
      dry_run:
        description: If true, logs decision without mutating labels
        required: false
        default: false
        type: boolean
    secrets:
      access_token:
        required: false

permissions:
  pull-requests: read
  contents: read
  checks: read
  statuses: read
  issues: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v4
        with:
          repository: shaypal5/pre-commit-ci-autofix-trigger
          # In reusable workflows, the github context comes from the caller repo,
          # so github.workflow_sha points at the caller commit, not this repo.
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: python -m pip install .

      - name: Resolve caller repo parts
        id: repo
        shell: bash
        run: |
          owner="${{ inputs.repo_owner }}"
          name="${{ inputs.repo_name }}"
          if [ -z "$owner" ]; then owner="${{ github.repository_owner }}"; fi
          if [ -z "$name" ]; then name="${{ github.event.repository.name }}"; fi
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Trigger pre-commit.ci autofix label
        env:
          GITHUB_TOKEN: ${{ secrets.access_token || github.token }}
        shell: bash
        run: |
          cmd=(
            pre-commit-ci-autofix-trigger
            --repo-owner "${{ steps.repo.outputs.owner }}"
            --repo-name "${{ steps.repo.outputs.name }}"
            --bot-logins "${{ inputs.bot_logins }}"
            --label "${{ inputs.label }}"
          )

          if [ "${{ inputs.pr_number }}" != "" ] && [ "${{ inputs.pr_number }}" != "0" ]; then
            cmd+=(--pr-number "${{ inputs.pr_number }}")
          fi

          if [ -n "${{ inputs.head_sha }}" ]; then
            cmd+=(--head-sha "${{ inputs.head_sha }}")
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cmd+=(--dry-run)
          fi

          "${cmd[@]}"
