[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pre-commit-ci-autofix-trigger"
version = "1.0.5"
description = "Reusable GitHub Action helper to trigger pre-commit.ci autofix labels for bot-authored PRs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest-cov>=5.0.0,<7",
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[project.scripts]
pre-commit-ci-autofix-trigger = "pre_commit_ci_autofix_trigger.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
